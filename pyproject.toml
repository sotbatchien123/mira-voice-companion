[project]
name = "mira-voice-companion"
version = "0.2.0"
description = "Mira – 3D Vietnamese Voice Companion: nhân vật VRM trên web, trò chuyện bằng giọng nói tiếng Việt chạy local"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.8",  # cần httpx2 + tham số fallbacks
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "httpx>=0.27",  # gọi Ollama local
    "vieneu>=3.8",  # giọng mặc định (Mỹ Duyên), CPU/ONNX, không torch; kéo theo librosa, scipy… (~0,5GB)
    "faster-whisper>=1.1",  # nghe giọng nói dự phòng (STT_PROVIDER=whisper)
    "sherpa-onnx>=1.12",  # nghe giọng nói mặc định: Zipformer-30M tiếng Việt (ít sai hơn ~2,5 lần, nhanh hơn ~10 lần Whisper)
]

[project.optional-dependencies]
# Giọng dự phòng (TTS_PROVIDER=piper). Để riêng vì thư viện là GPL-3.0, còn dự án là MIT
piper = ["piper-tts>=1.8"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
